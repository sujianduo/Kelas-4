<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>考试模拟练习 | Latihan SAS Bahasa Mandarin Kelas 4</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Poppins', 'Roboto', 'Noto Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #c2e0ff 0%, #b3d9ff 100%);
            min-height: 100vh;
            padding: 30px 20px;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: -20%;
            right: -10%;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(70, 150, 210, 0.12) 0%, rgba(100, 170, 230, 0.05) 100%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: "";
            position: fixed;
            bottom: -15%;
            left: -5%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(90, 180, 245, 0.08) 0%, rgba(50, 140, 210, 0.03) 100%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #eef6fe;
            backdrop-filter: blur(2px);
            border-radius: 48px;
            box-shadow: 0 25px 50px -12px rgba(0, 40, 70, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.7) inset;
            padding: 30px 32px;
            transition: all 0.2s;
            position: relative;
            z-index: 2;
        }

        .logo {
            display: block;
            margin: 0 auto 18px auto;
            width: 95px;
            height: auto;
            filter: drop-shadow(0 6px 12px rgba(0, 70, 100, 0.12));
            transition: transform 0.2s ease;
        }
        .logo:hover {
            transform: scale(1.02);
        }

        h1 {
            text-align: center;
            font-size: 1.9rem;
            background: linear-gradient(135deg, #1170a3, #2f8bbf);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
            font-weight: 700;
        }

        h2 {
            text-align: center;
            color: #16719e;
            font-weight: 500;
            font-size: 1.1rem;
            margin-bottom: 20px;
            background: #d7ecfc;
            display: inline-block;
            width: auto;
            padding: 6px 20px;
            border-radius: 40px;
            backdrop-filter: blur(2px);
        }

        .left-title {
            text-align: left;
            color: #156e9c;
            margin: 18px 0 12px 0;
            font-weight: 600;
            font-size: 1.3rem;
            border-left: 5px solid #3da0df;
            padding-left: 16px;
            background: none;
        }

        .progress-bar {
            height: 10px;
            background-color: #cae4f5;
            border-radius: 20px;
            margin: 10px 0 25px 0;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #5fcb8b);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border-radius: 20px;
            box-shadow: 0 0 6px #7bdaa4;
        }

        .question {
            margin-bottom: 28px;
            padding: 22px 24px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(0px);
            border-radius: 32px;
            box-shadow: 0 8px 18px rgba(0, 48, 80, 0.08);
            transition: all 0.25s;
            border: 1px solid rgba(100, 170, 220, 0.5);
        }
        .question:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 24px -8px rgba(32, 110, 150, 0.12);
            border-color: #8fcbff;
            background: rgba(255, 255, 255, 0.98);
        }

        .question-title {
            font-size: 1.2rem;
            margin-bottom: 18px;
            font-weight: 600;
            color: #1c577a;
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }
        .question-title .q-num {
            background: #cce5fa;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #0066a1;
        }

        .options {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option {
            padding: 14px 18px;
            background: #ffffff;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid #bbdef5;
            font-weight: 500;
            font-size: 1rem;
            color: #165d84;
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .option:before {
            content: "◯";
            font-size: 1.2rem;
            color: #6ea6cc;
            transition: all 0.2s;
        }
        .option:hover {
            background: #f0f9ff;
            border-color: #4aa3df;
            transform: scale(0.99);
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .option.selected {
            background: linear-gradient(105deg, #e3f3fe, #d2ecfe);
            border-color: #2d8fcf;
            color: #0a4b70;
            font-weight: 600;
        }
        .option.selected:before {
            content: "●";
            color: #2d8fcf;
            font-size: 1.2rem;
        }
        .option.correct {
            background: linear-gradient(105deg, #dcfce7, #c9f0da);
            border-color: #2ecc71;
            color: #145c2e;
        }
        .option.correct:before {
            content: "✓";
            font-weight: bold;
            color: #2b8c4a;
        }
        .option.incorrect {
            background: linear-gradient(105deg, #ffe8e6, #ffdad8);
            border-color: #e74c3c;
            color: #a12216;
            text-decoration-thickness: 1px;
        }
        .option.incorrect:before {
            content: "✗";
            color: #c0392b;
            font-weight: bold;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .btn {
            padding: 12px 32px;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.25s ease;
            font-size: 1rem;
            letter-spacing: 0.5px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.05);
        }
        .btn-primary {
            background: linear-gradient(120deg, #2c7cb6, #1f6392);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .btn-primary:hover {
            background: linear-gradient(120deg, #3f92cf, #2679ac);
            transform: translateY(-2px);
            box-shadow: 0 12px 22px -8px #1f639280;
        }
        .btn-tertiary {
            background: #ffffffee;
            color: #206694;
            border: 1px solid #bcd9f0;
            backdrop-filter: blur(4px);
        }
        .btn-tertiary:hover {
            background: white;
            border-color: #3788c2;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.05);
        }

        .result {
            text-align: center;
            padding: 32px 28px;
            background: #f0f8ff;
            border-radius: 48px;
            margin-top: 32px;
            display: none;
            box-shadow: 0 20px 35px -12px rgba(0,52,92,0.2);
            border: 1px solid #cae2f5;
            backdrop-filter: blur(4px);
        }
        .result h2 {
            color: #22668d;
            background: #e2f1fa;
            font-size: 1.8rem;
            margin-bottom: 12px;
        }
        .score {
            font-size: 58px;
            font-weight: 800;
            background: linear-gradient(135deg, #2c9bcf, #3acf8c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin: 15px 0;
        }
        .result-details {
            text-align: left;
            margin-top: 28px;
            background: #ffffffd9;
            border-radius: 36px;
            padding: 16px 26px;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #cae2f0;
            font-weight: 500;
        }
        .result-item span:first-child {
            color: #22668d;
        }
        .result-item span:last-child {
            font-weight: 700;
            color: #1f5e79;
        }
        .result-controls {
            display: flex;
            justify-content: center;
            margin-top: 28px;
        }
        #result-message {
            background: #eef6f0;
            padding: 12px 20px;
            border-radius: 60px;
            font-size: 1.05rem;
            font-weight: 500;
            color: #146b3a;
        }

        @media (max-width: 650px) {
            .container {
                padding: 20px 18px;
            }
            h1 {
                font-size: 1.5rem;
            }
            .question {
                padding: 16px 18px;
            }
            .option {
                padding: 12px 14px;
                font-size: 0.9rem;
            }
            .btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
            .left-title {
                font-size: 1.2rem;
            }
            .question-title {
                font-size: 1.05rem;
            }
            .score {
                font-size: 44px;
            }
        }

        .fineprint {
            text-align: center;
            margin-top: 25px;
            font-size: 0.75rem;
            color: #54809b;
            opacity: 0.8;
        }
        
        body, .option, .btn, .question-title, .result-details, .container, h1, h2 {
            line-height: 1.45;
        }
        .option {
            word-break: break-word;
        }
        @media (max-width: 480px) {
            .option {
                font-size: 0.85rem;
                padding: 10px 12px;
            }
            .question-title {
                font-size: 0.98rem;
            }
            .container {
                padding: 16px 14px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <img src="SD.png" alt="logo sekolah" class="logo" onerror="this.style.display='none'">
	
    <div style="text-align: center;"><h2>✨Latihan Soal SAS Bahasa Mandarin Kelas IV Semester Ganjil✨</h2></div>

    <div class="left-title">🎯 选择题 Pilihan Ganda</div>

    <div class="progress-bar"><div class="progress" id="progress"></div></div>
    <div id="questions-container"></div>

    <div class="controls">
        <button class="btn btn-primary" id="submit-btn">✅ 提交答案 | Submit</button>
    </div>

    <div class="result" id="result">
        <h2>🏆 测试结果 Hasil Tes 🏆</h2>
        <div class="score" id="score">0</div>
        <p id="result-message"></p>
        <div class="result-details">
            <div class="result-item"><span>✔️ 正确题数 Benar</span><span id="correct-count">0</span></div>
            <div class="result-item"><span>❌ 错误题数 Salah</span><span id="wrong-count">0</span></div>
            <div class="result-item"><span>📊 总分 Nilai Akhir</span><span id="total-score">0</span></div>
        </div>
        <div class="result-controls">
            <button class="btn btn-tertiary" id="retry-btn">🔄 再试一次 Ulangi</button>
        </div>
    </div>
    <div class="fineprint">⭐ 点击选项即可作答 · 可检查后提交 ⭐</div>
</div>

<script>
    const rawQuestions = [
        {id: 1, text: "书 shū ......", options: ["buku", "pensil", "tas sekolah", "penggaris"], correct: 0},
        {id: 2, text: "笔 bǐ ......", options: ["alat untuk menulis", "penggaris", "tas sekolah", "gunting"], correct: 0},
        {id: 3, text: "书包 shū bāo ......", options: ["tas sekolah", "meja", "penggaris", "pensil"], correct: 0},
        {id: 4, text: "同桌 tónɡ zhuō ......", options: ["teman semeja", "teman sekolah", "teman bermain", "teman masa kecil"], correct: 0},
        {id: 5, text: "谁 shéi ......", options: ["siapa", "apakah", "apa", "dimana"], correct: 0},
        {id: 6, text: "两 liǎnɡ ......", options: ["2", "1", "3", "4"], correct: 0},
        {id: 7, text: "Berapa ......", options: ["几 jǐ", "以 yǐ", "用 yònɡ", "有 yǒu"], correct: 0},
        {id: 8, text: "阿姨 ā yí ......", options: ["bibi", "kakek", "paman", "nenek"], correct: 0},
        {id: 9, text: "叔叔 shū shu ......", options: ["paman", "kakek", "nenek", "bibi"], correct: 0},
        {id: 10, text: "Boleh ......", options: ["可以 kě yǐ", "几 jǐ", "什么 shén me", "用 yònɡ"], correct: 0},
        {id: 11, text: "Sekolah ......", options: ["学校 xué xiào", "食堂 shí tánɡ", "家 jiā", "公园 ɡōnɡ yuán"], correct: 0},
        {id: 12, text: "食堂 shí tánɡ ......", options: ["kantin", "rumah", "sekolah", "kantor"], correct: 0},
        {id: 13, text: "Komputer ......", options: ["电脑 diàn nǎo", "自行车 zì xínɡ chē", "雨伞 yǔ sǎn", "照片 zhào piàn"], correct: 0},
        {id: 14, text: "没有 méi yǒu ......", options: ["tidak punya", "boleh", "punya atau tidak", "punya"], correct: 0},
        {id: 15, text: "Punya atau tidak ......", options: ["有没有 yǒu méi yǒu", "可以 kě yǐ", "用 yònɡ", "没有 méi yǒu"], correct: 0},
        {id: 16, text: "上面 shànɡ miàn ......", options: ["di atas", "di bawah", "sebelah kanan", "sebelah kiri"], correct: 0},
        {id: 17, text: "Di bawah ......", options: ["下面 xià miàn", "左边 zuǒ biān", "右边 yòu biān", "上面 shànɡ miàn"], correct: 0},
        {id: 18, text: "左边 zuǒ biān ......", options: ["sebelah kiri", "di atas", "sebelah kanan", "di bawah"], correct: 0},
        {id: 19, text: "Sebelah kanan ......", options: ["右边 yòu biān", "左边 zuǒ biān", "下面 xià miàn", "上面 shànɡ miàn"], correct: 0},
        {id: 20, text: "在 zài ......", options: ["di", "kemana", "ke", "kepada"], correct: 0},
        {id: 21, text: "房间 fánɡ jiān ......", options: ["kamar", "lemari pakaian", "meja bundar", "ranjang"], correct: 0},
        {id: 22, text: "Di sini ......", options: ["这儿 zhèr", "那儿 nàr", "上面 shànɡ miàn", "下面 xià miàn"], correct: 0},
        {id: 23, text: "Rak buku ......", options: ["书架 shū jià", "桌子 zhuō zi", "书包 shū bāo", "教室 jiào shì"], correct: 0},
        {id: 24, text: "Lemari pakaian ......", options: ["衣柜 yī ɡuì", "圆桌 yuán zhuō", "足球 zú qiú", "书架 shū jià"], correct: 0},
        {id: 25, text: "家 jiā ......", options: ["rumah", "sekolah", "kantin", "taman"], correct: 0},
		{id: 26, text: "这是我的 ...... ( shū ) 。", options: ["书", "笔", "桌", "床"], correct: 0},
		{id: 27, text: "这是小强的 ...... ( bǐ ) 。", options: ["笔", "书", "椅", "球"], correct: 0},
		{id: 28, text: "我有 ...... ( liǎnɡ ) 本书 。", options: ["两", "四", "六", "八"], correct: 0},
		{id: 29, text: "我有一个 ...... ( shū bāo ) 。", options: ["书包", "电脑", "书架", "圆桌"], correct: 0},
		{id: 30, text: "你家有 ...... ( diàn nǎo ) 吗？", options: ["电脑", "书架", "圆桌", "字典"], correct: 0},
		{id: 31, text: "我 ...... ( méi yǒu ) 字典。", options: ["没有", "这儿", "不是", "左边"], correct: 0},
		{id: 32, text: "书在 ...... ( shū jià ) 上。", options: ["书架", "桌子", "衣柜", "足球"], correct: 0},
		{id: 33, text: "我们 ...... ( xué xiào ) 有图书馆。", options: ["学校", "教室", "厕所", "食堂"], correct: 0},
		{id: 34, text: "这是我的 ...... ( fánɡ jiān )。", options: ["房间", "书架", "衣柜", "电脑"], correct: 0},
		{id: 35, text: "...... ( zhè er ) 有一张床。", options: ["这儿", "那是", "没有", "上面"], correct: 0},
		{id: 36, text: "wǒ jiā yǒu liǎnɡ tái diàn nǎo<br>我 家 有 两 台 电 脑 。", options: ["Di rumah saya ada 2 unit komputer.", "Ini adalah tas sekolah saya.", "Saya mempunyai 2 buah buku.", "Ini adalah kamar saya."], correct: 0},
		{id: 37, text: "mèi mei zài mā ma de yòu biān<br>妹 妹 在 妈 妈 的 右 边 。", options: ["Adik perempuan berada di sebelah kanan ibu.", "Adik perempuan berada di sebelah kiri ibu.", "Kakak perempuan berada di sebelah kanan ibu.", "Kakak perempuan berada di sebelah kiri ibu."], correct: 0},
		{id: 38, text: "zhè shì wǒ de shū bāo<br>Ini adalah tas sekolah saya.", options: ["这是我的书包。", "这是我的房间。", "这是我的铅笔。", "这是我的桌子。"], correct: 0},
		{id: 39, text: "wǒ yǒu liǎnɡ běn shū<br>Saya mempunyai 2 buah buku.", options: ["我有两本书。", "我没有电脑。", "我有两支笔。", "我有中文书。"], correct: 0},
		{id: 40, text: "zhè shì wǒ de fánɡ jiān<br>Ini adalah kamar saya.", options: ["这是我的房间。", "这是我的书包。", "这是我的字典。", "这是我的电脑。"], correct: 0}
    ];

    let currentQuestions = [];
    let userAnswers = {};
    let isCheckingAnswers = false;

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function initExam() {
        userAnswers = {};
        isCheckingAnswers = false;
        const container = document.getElementById('questions-container');
        if (!container) return;
        container.innerHTML = '';

        let shuffledQuestions = shuffleArray([...rawQuestions.map(q => ({ ...q }))]);

        currentQuestions = shuffledQuestions.map(q => {
            const optWithOrigIdx = q.options.map((opt, idx) => ({ text: opt, origIdx: idx }));
            const shuffledOpts = shuffleArray([...optWithOrigIdx]);
            const newCorrectIdx = shuffledOpts.findIndex(opt => opt.origIdx === q.correct);
            return {
                id: q.id,
                text: q.text,
                originalOptions: q.options,
                shuffledOptions: shuffledOpts.map(opt => opt.text),
                shuffledCorrect: newCorrectIdx,
            };
        });

        renderQuestions(currentQuestions);
        updateProgressBar();
    }

    function renderQuestions(questions) {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';

        questions.forEach((question, idx) => {
            const qDiv = document.createElement('div');
            qDiv.className = 'question';
            const displayNumber = idx + 1;
            const titleHtml = `<div class="question-title"><span class="q-num">${displayNumber}</span><span>${question.text}</span></div>`;
            const optionsHtml = question.shuffledOptions.map((opt, optIdx) => {
                return `<li class="option" data-qid="${question.id}" data-val="${optIdx}">${opt}</li>`;
            }).join('');
            qDiv.innerHTML = titleHtml + `<ul class="options">${optionsHtml}</ul>`;
            container.appendChild(qDiv);
        });

        if (window._optionHandler) {
            container.removeEventListener('click', window._optionHandler);
        }
        const clickHandler = (e) => {
            if (isCheckingAnswers) return;
            const optionEl = e.target.closest('.option');
            if (!optionEl) return;
            const qid = parseInt(optionEl.getAttribute('data-qid'));
            const val = parseInt(optionEl.getAttribute('data-val'));
            if (isNaN(qid) || isNaN(val)) return;

            const parentOptions = optionEl.parentElement.querySelectorAll('.option');
            parentOptions.forEach(opt => {
                opt.classList.remove('selected');
            });
            optionEl.classList.add('selected');
            userAnswers[qid] = val;
            updateProgressBar();
        };
        container.addEventListener('click', clickHandler);
        window._optionHandler = clickHandler;
    }

    function updateProgressBar() {
        const total = currentQuestions.length;
        const answered = Object.keys(userAnswers).length;
        const percent = total === 0 ? 0 : (answered / total) * 100;
        const progressEl = document.getElementById('progress');
        if (progressEl) progressEl.style.width = `${percent}%`;
    }

    function submitExam() {
        if (isCheckingAnswers) return;
        const totalQ = currentQuestions.length;
        const answeredCount = Object.keys(userAnswers).length;
        if (answeredCount < totalQ) {
            if (!confirm(`⚠️ 还有 ${totalQ - answeredCount} 道题未作答，确定要提交吗？\nMasih ada ${totalQ - answeredCount} soal belum dijawab, yakin submit?`)) {
                return;
            }
        }

        let correct = 0;
        currentQuestions.forEach(q => {
            const userChoice = userAnswers[q.id];
            if (userChoice !== undefined && userChoice === q.shuffledCorrect) {
                correct++;
            }
        });

        const total = currentQuestions.length;
        const scoreValue = Math.round((correct / total) * 100);
        document.getElementById('score').innerText = scoreValue;
        document.getElementById('correct-count').innerText = correct;
        document.getElementById('wrong-count').innerText = total - correct;
        document.getElementById('total-score').innerHTML = `${scoreValue} 分 (满分100)`;

        let msg = "";
        if (scoreValue >= 90) msg = "🌟 优秀！ Luar biasa! Pertahankan! 🌟";
        else if (scoreValue >= 80) msg = "🎉 良好！ Bagus, tingkatkan lagi! 🎉";
        else if (scoreValue >= 60) msg = "📘 及格！ Cukup, belajar lebih giat ya! 📘";
        else msg = "📚 努力再努力！ Ulangi dan semangat belajar! 💪";
        document.getElementById('result-message').innerHTML = msg;
        
        const resultDiv = document.getElementById('result');
        if (resultDiv) resultDiv.style.display = 'block';
        
        highlightAnswers();
        resultDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function highlightAnswers() {
        isCheckingAnswers = true;
        currentQuestions.forEach(q => {
            const correctIdx = q.shuffledCorrect;
            const optionsNodes = document.querySelectorAll(`.option[data-qid="${q.id}"]`);
            optionsNodes.forEach(opt => {
                const val = parseInt(opt.getAttribute('data-val'));
                if (val === correctIdx) {
                    opt.classList.add('correct');
                }
                const userVal = userAnswers[q.id];
                if (userVal !== undefined && userVal === val && val !== correctIdx) {
                    opt.classList.add('incorrect');
                }
                if (userVal === correctIdx && val === correctIdx) {
                    opt.classList.add('correct');
                }
            });
        });
        document.querySelectorAll('.option').forEach(opt => {
            opt.style.cursor = 'default';
        });
    }

    function retryExam() {
        isCheckingAnswers = false;
        const resultDiv = document.getElementById('result');
        if (resultDiv) resultDiv.style.display = 'none';
        userAnswers = {};
        initExam();
        updateProgressBar();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('DOMContentLoaded', () => {
        initExam();
        const submitBtn = document.getElementById('submit-btn');
        const retryBtn = document.getElementById('retry-btn');
        if (submitBtn) submitBtn.addEventListener('click', submitExam);
        if (retryBtn) retryBtn.addEventListener('click', retryExam);
    });
</script>
</body>
</html>
